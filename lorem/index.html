<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Data | RMKR Toolkit</title>
  <meta name="description" content="Generate lorem text and sample records.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  
  <script src="../assets/site.js" defer></script>
</head>
<body data-root="../" data-tool="lorem">
<main class="wrap page-main" id="main">
  <h1 class="page-title">Sample Data</h1>
  <p class="page-lead">Quick filler copy, names, and JSON rows for mocks and screenshots.</p>

  <div class="toolbar">
    <label for="kind" style="margin:0;">Kind</label>
    <select id="kind" style="width:auto;">
      <option value="paras">Paragraphs</option>
      <option value="words">Words</option>
      <option value="people">People JSON</option>
      <option value="logs">Log lines</option>
    </select>
    <label for="count" style="margin:0;">Count</label>
    <input id="count" type="number" min="1" max="50" value="3" style="width:5rem;">
    <button class="btn btn-gold" type="button" id="run">Generate</button>
    <button class="btn btn-ghost" type="button" id="copyOut">Copy</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <textarea id="output" spellcheck="false" readonly style="min-height:280px;"></textarea>

</main>
<script>

const WORDS = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat'.split(' ');
const FIRST = ['Ada','Grace','Linus','Barbara','Ken','Margaret','Dennis','Radia','Alan','Leslie'];
const LAST = ['Lovelace','Hopper','Torvalds','Liskov','Thompson','Hamilton','Ritchie','Perlman','Kay','Lamport'];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function words(n){ const out=[]; for(let i=0;i<n;i++) out.push(pick(WORDS)); return out.join(' '); }
function para(){ const s=words(12+Math.floor(Math.random()*18)); return s[0].toUpperCase()+s.slice(1)+'.'; }
function generate() {
  let n = parseInt(document.getElementById('count').value,10) || 1;
  n = Math.min(50, Math.max(1,n));
  const kind = document.getElementById('kind').value;
  let text = '';
  if (kind === 'paras') text = Array.from({length:n}, para).join('\n\n');
  else if (kind === 'words') text = words(n);
  else if (kind === 'people') {
    const rows = Array.from({length:n}, (_,i) => {
      const first = pick(FIRST), last = pick(LAST);
      return { id: i+1, name: first+' '+last, email: (first+'.'+last).toLowerCase()+'@example.com', role: pick(['engineer','designer','ops','research']) };
    });
    text = JSON.stringify(rows, null, 2);
  } else {
    text = Array.from({length:n}, (_,i) => {
      const lvl = pick(['INFO','WARN','ERROR','DEBUG']);
      return new Date(Date.now()-i*1000).toISOString() + ' ['+lvl+'] ' + para();
    }).join('\n');
  }
  document.getElementById('output').value = text;
  RMKR.setStatus(document.getElementById('status'), 'Generated.', 'ok');
}
document.getElementById('run').onclick = generate;
document.getElementById('copyOut').onclick = () => {
  const v = document.getElementById('output').value;
  if (!v) return RMKR.setStatus(document.getElementById('status'), 'Generate first.', 'err');
  RMKR.copy(v).then(() => RMKR.setStatus(document.getElementById('status'), 'Copied.', 'ok'));
};
generate();

</script>
</body>
</html>
