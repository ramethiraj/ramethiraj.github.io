<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAML ↔ JSON | RMKR Toolkit</title>
  <meta name="description" content="Convert YAML and JSON in the browser.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/vendor/js-yaml.min.js"></script>
  <script src="../assets/site.js" defer></script>
</head>
<body data-root="../" data-tool="yaml">
<main class="wrap page-main" id="main">
  <h1 class="page-title">YAML ↔ JSON</h1>
  <p class="page-lead">Everything runs locally. Use this for configs, manifests, and API samples.</p>

  <div class="toolbar">
    <button class="btn btn-gold" type="button" id="toJson">YAML → JSON</button>
    <button class="btn btn-ghost" type="button" id="toYaml">JSON → YAML</button>
    <button class="btn btn-ghost" type="button" id="pretty">Pretty JSON</button>
    <button class="btn btn-ghost" type="button" id="minify">Minify JSON</button>
    <button class="btn btn-ghost" type="button" id="copyOut">Copy output</button>
    <button class="btn btn-danger" type="button" id="clear">Clear</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="pane-grid">
    <div>
      <label for="input">Input</label>
      <textarea id="input" spellcheck="false" placeholder="Paste YAML or JSON">name: toolkit
version: 1
features:
  - yaml
  - json
</textarea>
    </div>
    <div>
      <label for="output">Output</label>
      <textarea id="output" spellcheck="false" readonly placeholder="Result appears here"></textarea>
    </div>
  </div>

</main>
<script>

const input = document.getElementById('input');
const output = document.getElementById('output');
const status = document.getElementById('status');

function show(err, ok) {
  RMKR.setStatus(status, err || ok || '', err ? 'err' : (ok ? 'ok' : ''));
}
function parseAny(text) {
  const t = text.trim();
  if (!t) throw new Error('Paste YAML or JSON first.');
  if (t.startsWith('{') || t.startsWith('[')) return JSON.parse(t);
  return jsyaml.load(t);
}
document.getElementById('toJson').onclick = () => {
  try { output.value = JSON.stringify(parseAny(input.value), null, 2); show(null, 'Converted to JSON.'); }
  catch (e) { show(e.message); }
};
document.getElementById('toYaml').onclick = () => {
  try { output.value = jsyaml.dump(parseAny(input.value), { lineWidth: 100 }); show(null, 'Converted to YAML.'); }
  catch (e) { show(e.message); }
};
document.getElementById('pretty').onclick = () => {
  try { output.value = JSON.stringify(parseAny(input.value), null, 2); show(null, 'Pretty-printed.'); }
  catch (e) { show(e.message); }
};
document.getElementById('minify').onclick = () => {
  try { output.value = JSON.stringify(parseAny(input.value)); show(null, 'Minified.'); }
  catch (e) { show(e.message); }
};
document.getElementById('copyOut').onclick = () => {
  if (!output.value) return show('Nothing to copy.');
  RMKR.copy(output.value).then(() => show(null, 'Copied.'));
};
document.getElementById('clear').onclick = () => { input.value = ''; output.value = ''; show(); };

</script>
</body>
</html>
