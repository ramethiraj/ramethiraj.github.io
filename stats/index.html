<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Stats | RMKR Toolkit</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/site.js" defer></script>
</head>
<body data-root="../" data-tool="stats">
<main class="wrap page-main" id="main">
  <h1 class="page-title">Local Stats</h1>
  <p class="page-lead">Open counts stored only in this browser. Nothing is sent to a server.</p>
  <div class="toolbar">
    <button class="btn btn-danger" type="button" id="clear">Clear local counts</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="tool-grid" id="grid"></div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const grid = document.getElementById('grid');
    function render() {
      grid.innerHTML = '';
      const items = [{ id: 'home', name: 'Home' }].concat(RMKR.tools);
      items.forEach(function (t) {
        const n = parseInt(localStorage.getItem('rmkr-stat-' + t.id) || '0', 10) || 0;
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = '<h3>' + t.name + '</h3><p class="mono" style="font-size:1.4rem;color:var(--color-text);">' + n + '</p>';
        grid.appendChild(card);
      });
    }
    document.getElementById('clear').onclick = function () {
      Object.keys(localStorage).filter(k => k.startsWith('rmkr-stat-')).forEach(k => localStorage.removeItem(k));
      RMKR.setStatus(document.getElementById('status'), 'Cleared.', 'ok');
      render();
    };
    render();
  });
</script>
</body>
</html>
