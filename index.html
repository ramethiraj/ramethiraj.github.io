<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMKR Toolkit</title>
  <meta name="description" content="Client-side developer toolkit. Transforms, hashes, diffs, and more — all in the browser.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body data-root="" data-tool="home">
<main class="wrap page-main" id="main">
  <header class="hero">
    <h1>Ramkumar Ethiraj</h1>
    <p>A client-side developer toolkit. Convert, inspect, and sketch without sending your data to a server.</p>
    <div class="hero-actions">
      <a class="btn btn-gold" href="profile.html">View profile</a>
      <div class="socials">
        <a href="https://github.com/rmkr-dev" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://linkedin.com/in/ramkumarethiraj" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
  </header>

  <div id="catalog"></div>
</main>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const root = document.getElementById('catalog');
    const prefix = RMKR.rootPrefix();
    RMKR.cats.forEach(function (cat) {
      const tools = RMKR.tools.filter(function (t) { return t.cat === cat; });
      if (!tools.length) return;
      const title = document.createElement('h2');
      title.className = 'section-title';
      title.textContent = cat;
      root.appendChild(title);
      const grid = document.createElement('div');
      grid.className = 'tool-grid';
      tools.forEach(function (t) {
        const a = document.createElement('a');
        a.className = 'tool-card';
        a.href = prefix + t.path;
        a.innerHTML = '<h3>' + t.name + '</h3><p>' + t.blurb + '</p>';
        grid.appendChild(a);
      });
      root.appendChild(grid);
    });
  });
</script>
</body>
</html>
