<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payload Diff | RMKR Toolkit</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/site.js" defer></script>
</head>
<body data-root="../" data-tool="diff">
<main class="wrap wrap-wide page-main" id="main">
  <h1 class="page-title">Payload Diff</h1>
  <p class="page-lead">Compare two texts or JSON payloads. Optional pretty-print makes object diffs easier to read.</p>
  <div class="toolbar">
    <label class="muted" style="margin:0;text-transform:none;letter-spacing:0;font-weight:600;">
      <input type="checkbox" id="pretty"> Pretty-print JSON first
    </label>
    <button class="btn btn-gold" type="button" id="run">Find differences</button>
    <button class="btn btn-danger" type="button" id="clear">Clear</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="pane-grid">
    <div>
      <label for="left">Original</label>
      <textarea id="left" spellcheck="false" placeholder="Original JSON or text"></textarea>
    </div>
    <div>
      <label for="right">Modified</label>
      <textarea id="right" spellcheck="false" placeholder="Modified JSON or text"></textarea>
    </div>
  </div>
  <div class="card" style="margin-top:1rem;">
    <pre class="out" id="result">Compare payloads to see results.</pre>
  </div>
</main>
<script>
  function maybePretty(text) {
    if (!document.getElementById('pretty').checked) return text;
    const t = text.trim();
    if (!t) return text;
    try { return JSON.stringify(JSON.parse(t), null, 2); }
    catch (e) { return text; }
  }
  function compare() {
    const leftRaw = document.getElementById('left').value;
    const rightRaw = document.getElementById('right').value;
    const res = document.getElementById('result');
    if (!leftRaw.trim() && !rightRaw.trim()) {
      res.textContent = 'Paste text on one or both sides.';
      RMKR.setStatus(document.getElementById('status'), 'Both sides are empty.', 'err');
      return;
    }
    const left = maybePretty(leftRaw).replace(/\r\n/g, '\n').split('\n');
    const right = maybePretty(rightRaw).replace(/\r\n/g, '\n').split('\n');
    const max = Math.max(left.length, right.length);
    const lines = [];
    let adds = 0, dels = 0, same = 0;
    for (let i = 0; i < max; i++) {
      const l = left[i] ?? '';
      const r = right[i] ?? '';
      if (l === r) {
        same++;
        lines.push('<div class="diff-same">  ' + escapeHtml(l) + '</div>');
      } else {
        if (l) { dels++; lines.push('<div class="diff-removed">- ' + escapeHtml(l) + '</div>'); }
        if (r) { adds++; lines.push('<div class="diff-added">+ ' + escapeHtml(r) + '</div>'); }
      }
    }
    if (adds === 0 && dels === 0) {
      res.textContent = 'The two sides match.';
      RMKR.setStatus(document.getElementById('status'), 'No differences.', 'ok');
      return;
    }
    res.innerHTML = lines.join('');
    RMKR.setStatus(document.getElementById('status'), adds + ' added, ' + dels + ' removed, ' + same + ' unchanged.', 'ok');
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
  }
  document.getElementById('run').onclick = compare;
  document.getElementById('clear').onclick = () => {
    document.getElementById('left').value = '';
    document.getElementById('right').value = '';
    document.getElementById('result').textContent = 'Compare payloads to see results.';
    RMKR.setStatus(document.getElementById('status'), '');
  };
</script>
</body>
</html>
