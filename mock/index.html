<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Generator | RMKR Toolkit</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/site.js" defer></script>
</head>
<body data-root="../" data-tool="mock">
<main class="wrap page-main" id="main">
  <h1 class="page-title">Mock Generator</h1>
  <p class="page-lead">Build sample JSON from field names. Names that look like id, email, or timestamp get matching fake values.</p>
  <label for="keys">Fields</label>
  <input id="keys" type="text" value="id, name, email, status, timestamp">
  <div class="toolbar">
    <label for="count" style="margin:0;">Records</label>
    <input id="count" type="number" min="1" max="200" value="10" style="width:5rem;">
    <button class="btn btn-gold" type="button" id="run">Generate</button>
    <button class="btn btn-ghost" type="button" id="copyOut">Copy</button>
  </div>
  <p class="status" id="status" role="status"></p>
  <textarea id="output" readonly spellcheck="false" style="min-height:320px;"></textarea>
</main>
<script>
  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random()*16|0;
      return (c === 'x' ? r : (r&0x3|0x8)).toString(16);
    });
  }
  function valueFor(key, i) {
    const k = key.toLowerCase();
    if (k === 'id' || k.endsWith('id')) return k.includes('uuid') ? uuid() : i;
    if (k.includes('email')) return 'user' + i + '@example.com';
    if (k.includes('uuid')) return uuid();
    if (k.includes('time') || k.includes('date')) return new Date(Date.now() - i * 3600000).toISOString();
    if (k.includes('status')) return ['active','pending','closed'][i % 3];
    if (k.includes('name')) return ['Ada Lovelace','Grace Hopper','Linus Torvalds','Barbara Liskov'][i % 4];
    if (k.includes('bool') || k.startsWith('is') || k.startsWith('has')) return i % 2 === 0;
    if (k.includes('count') || k.includes('amount') || k.includes('qty')) return (i * 7) % 50;
    return 'mock_' + key + '_' + (100 + i);
  }
  function generate() {
    const keys = document.getElementById('keys').value.split(',').map(s => s.trim()).filter(Boolean);
    if (!keys.length) {
      RMKR.setStatus(document.getElementById('status'), 'Add at least one field name.', 'err');
      return;
    }
    let n = parseInt(document.getElementById('count').value, 10) || 10;
    n = Math.min(200, Math.max(1, n));
    const data = Array.from({length: n}, (_, i) => {
      const obj = {};
      keys.forEach(k => { obj[k] = valueFor(k, i + 1); });
      return obj;
    });
    document.getElementById('output').value = JSON.stringify(data, null, 2);
    RMKR.setStatus(document.getElementById('status'), n + ' records ready.', 'ok');
  }
  document.getElementById('run').onclick = generate;
  document.getElementById('copyOut').onclick = () => {
    const v = document.getElementById('output').value;
    if (!v) return RMKR.setStatus(document.getElementById('status'), 'Generate first.', 'err');
    RMKR.copy(v).then(() => RMKR.setStatus(document.getElementById('status'), 'Copied.', 'ok'));
  };
  generate();
</script>
</body>
</html>
